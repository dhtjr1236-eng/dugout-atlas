name: Windows release

on:
  push:
    branches: ['release/windows-v1.92']

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt
            constraints-release.txt
      - name: Install dependencies and compiler
        shell: pwsh
        run: |
          python -m pip install -r requirements.txt -c constraints-release.txt -r requirements-build.txt
          choco upgrade innosetup --version=6.7.3 --allow-downgrade -y --no-progress
      - name: Verify the source
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
      - name: Build and verify the Windows package
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])"
          if ($version -ne '1.92') { throw "Unexpected release version: $version" }
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          ./tools/build_setup.ps1 -Python (Get-Command python).Source -Iscc $iscc
          ./tools/test_installer.ps1 -Installer (Resolve-Path "release/DugoutAtlas-v$version-Setup.exe")
      - uses: actions/upload-artifact@v4
        with:
          name: dugout-atlas-windows-v1.92
          path: |
            release/DugoutAtlas-v1.92-Setup.exe
            release/DugoutAtlas-v1.92-source.zip
            release/DugoutAtlas-v1.92-SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: dugout-atlas-windows-v1.92
          path: release
      - name: Publish verified files for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd release && sha256sum -c DugoutAtlas-v1.92-SHA256SUMS.txt)
          gh release create v1.92 \
            release/DugoutAtlas-v1.92-Setup.exe \
            release/DugoutAtlas-v1.92-source.zip \
            release/DugoutAtlas-v1.92-SHA256SUMS.txt \
            --target "$GITHUB_SHA" --latest --title "Dugout Atlas v1.92" \
            --notes-file docs/PATCH_v1.92.md
