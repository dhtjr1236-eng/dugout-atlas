name: CI

on:
  push:
    branches: [main, "release/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Qt runtime
        run: sudo apt-get update && sudo apt-get install -y libegl1
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -c constraints-release.txt
      - name: Install security checks
        run: python -m pip install ruff pip-audit bandit
      - name: Lint critical errors
        run: ruff check --select E9,F63,F7,F82 .
      - name: Dependency vulnerabilities
        run: pip-audit --local
      - name: Static security scan
        run: bandit -r config services controllers ui database cache main.py -ll -q
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
      - name: Package metadata smoke test
        run: python -c "from config.settings import SETTINGS; assert SETTINGS.app_version == '1.40'"
